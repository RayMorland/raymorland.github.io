---
layout: default
title: Services
permalink: /services/
---

<div class="container d-flex flex-column gap-4">
  <h1 class="fw-bold">Services
  </h1>
  <div class="row mb-2">
    <div class="col-md-3">
      <h2 class="mb-3">What I can do</h2>
    </div>
    <div class="col-md-9">
      {% for service in site.data.services %}
        <div class="d-flex flex-row justify-content-between mb-2">
          <div>
            <h3>{{ service.name }}</h3>
            <h4>{{ service.description }}</h4>
          </div>
        </div>
      {% endfor %}
    </div>
  </div>

  <div class="row mb-2">
    <div class="col-md-3">
      <h2 class="mb-3">Technologies I use</h2>
    </div>
    <div class="col-md-9">

      <div class="d-flex flex-row gap-3 mb-2">
        {% for technology in site.data.technologies %}
          <div>
            <a
              href="{{ technology.link }}"
              target="_blank"
              rel="noopener noreferrer">
              <h3>{{ technology.name }}</h3>
            </a>
          </div>
        {% endfor %}
      </div>

    </div>
  </div>
</div>
