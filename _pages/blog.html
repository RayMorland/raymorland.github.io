---
layout: default
title: Blog
permalink: /blog
---

<div class="container d-flex flex-column gap-4">
  <h1 class="fw-bold">Blog</h1>
  <div class="row mb-2">
    <div class="col-12">
      {% if site.posts.size > 0 %}
        {% for post in site.posts %}
          <div class="d-flex flex-row justify-content-between mb-2 cursor-pointer" style="border-color: #6f42c1; border-width: 1px">
            <a href="{{ post.url }}" class="post-preview">{{ post.title }}</a>
          </div>
        {% endfor %}
      {% else %}
        <p class="fs-5">No Posts</p>
      {% endif %}
    </div>
  </div>
</div>
